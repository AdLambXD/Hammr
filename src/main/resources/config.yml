# ============================================
# HammrEnhance - 下界合金装备强化系统 配置
# ============================================

# 主强化各等级成功率 (%) - 按等级顺序
# 例如: 第1个值表示从+1强化到+2的成功率, 第2个值表示+2→+3, 以此类推
# 前松后紧型曲线: 起步稳健, 末段逐步收紧
main-success-rates: [92, 90, 88, 86, 82, 74, 64, 50, 38, 28]

# 分支强化各等级成功率 (%) - 按等级顺序
branch-success-rates: [40, 36, 32, 28, 24]

# 主强化最高等级 (默认: 10)
main-max-level: 10

# 分支强化最高总等级 (默认: 6)
branch-max-level: 6

# 分支强化所需最低主等级 (默认: 8)
branch-min-main-level: 6

# 每次强化消耗金币 (当 cost-gold-per-level 为空时使用此值)
cost-gold: 1000

# 按等级的金币消耗 (优先级高于 cost-gold)
# 如果为空列表则使用 cost-gold 的固定值
# 格式示例:
#   cost-gold-per-level: [500, 800, 1000, 1500, 2000, 2500, 3000, 4000, 5000, 8000]
cost-gold-per-level: []

# 强化金币收入去向 - 玩家扣除的金币会转入此账户
# 留空("")则只扣除玩家金币, 不进行转账(纯金币回收)
# 可填: 玩家名 / 玩家 UUID(带不带横线都行) / 银行账户名
# 本插件不会自己推算 UUID: 优先用服务端已知的真实 UUID(正版、外置登录如 LittleSkin 都适用),
# 服务端缓存里没有该名字时, 交给 Vault 的名字接口由经济插件自行解析
income-account: ""

# 收入账户类型:
#   auto    - 默认。优先按玩家账户转账; 解析不到玩家且存在同名银行账户时才转入银行
#   player  - 强制按玩家账户转账, 在线/离线玩家都能收到(效果等同 cmi pay)
#   bank    - Vault 银行账户, 需要经济插件实现银行功能
#   command - 由控制台执行下方 income-account-command 转账, 适用于 Vault 接口覆盖不到的经济插件
income-account-type: auto

# 仅当 income-account-type: command 时生效
# 可用占位符: %account%(= %player%, 即 income-account) / %amount% / %payer%(付款玩家)
# CMI 示例:        "cmi money give %account% %amount%"
# Essentials 示例: "eco give %account% %amount%"
income-account-command: "cmi money give %account% %amount%"

# 失败掉级概率 (0.0 - 1.0)
level-down-chance: 0.12

# 铁砧爆炸概率 (0.0 - 1.0)
explosion-chance: 0.03

# 铁砧爆炸半径 (默认: 1.0)
explosion-radius: 2.0

# 装备经验需求公式: xp-base × 主等级^xp-exponent
# 例如默认 5 × 主等级^2.5: +1→+2 需 5 点, +2→+3 需 28 点, +9→+10 需 1215 点
# 若 xp-exponent 设置为 0 或缺失, 则回退为旧版线性公式 (主等级 × xp-multiplier)
xp-base: 5
xp-exponent: 2.5

# 挖掘方块时获得的物品经验值 (默认: 1)
block-break-xp: 1

# 获得经验球时转化的物品经验值 (默认: 1)
xp-from-exp-orb: 1

# 最高级强化达成时是否全服公告
broadcast-on-max-level: true

# 是否播放音效
sound-enabled: true

# 主强化材料切换等级 (默认: 6)
# 主等级低于此值时使用 main-low 材料，大于等于此值时使用 main-high 材料
main-material-threshold: 6

# 材料设置
materials:
  # 主强化低级材料 (主等级 < main-material-threshold 时使用)
  main-low: DIAMOND
  # 主强化高级材料 (主等级 >= main-material-threshold 时使用)
  main-high: NETHERITE_INGOT
  # 分支强化材料
  branch: DIAMOND

# ============================================
# 分支强化池
# 每种装备类型可随机获得的分支附魔列表
# ============================================
branch-pools:
  SWORD:
    - fire_aspect
    - bane_of_arthropods
    - smite
  AXE:
    - fire_aspect
    - bane_of_arthropods
    - smite
  HELMET:
    - projectile_protection
    - fire_protection
    - blast_protection
  CHESTPLATE:
    - projectile_protection
    - fire_protection
    - blast_protection
  LEGGINGS:
    - projectile_protection
    - fire_protection
    - blast_protection
  BOOTS:
    - projectile_protection
    - fire_protection
    - blast_protection

# ============================================
# 主附魔映射
# 装备类型 -> 对应 Minecraft 附魔 ID
# ============================================
main-enchant-mapping:
  SWORD: sharpness
  AXE: sharpness
  PICKAXE: efficiency
  SHOVEL: efficiency
  HOE: efficiency
  HELMET: protection
  CHESTPLATE: protection
  LEGGINGS: protection
  BOOTS: protection

# ============================================
# 进度条样式
# ============================================
progress-bar:
  # 进度条总宽度 (字符数)
  width: 25
  # 已填充部分的颜色代码
  filled-color: "§a"
  # 未填充部分的颜色代码
  empty-color: "§8"
  # 百分比文字的颜色代码
  suffix-color: "§f"
  # 填充和空白使用的字符
  char: "|"
  # 百分比文字格式 (%s 会被替换为百分比数值)
  suffix-format: " %s%%"
