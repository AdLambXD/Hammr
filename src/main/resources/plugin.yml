name: ${name}
version: ${version}
main: org.cubex.hammr.HammrEnhance
api-version: "1.21"
authors: [CubeX, AdLamb, FZAoao]
website: https://github.com/AdLambXD/Hammr
description: 下界合金装备铁砧强化系统
soft-depend:
  - Vault

commands:
  hammr:
    description: HammrEnhance 管理命令
    usage: /hammr <set|remove|give|reload>

permissions:
  hammr.use:
    description: 允许在铁砧上使用强化系统
    default: true
  hammr.command.set:
    description: 允许使用 /hammr set
    default: op
  hammr.command.remove:
    description: 允许使用 /hammr remove
    default: op
  hammr.command.give:
    description: 允许使用 /hammr give
    default: op
  hammr.command.reload:
    description: 允许使用 /hammr reload
    default: op
  hammr.admin:
    description: 允许使用所有 HammrEnhance 管理命令
    default: op
    children:
      hammr.use: true
      hammr.command.set: true
      hammr.command.remove: true
      hammr.command.give: true
      hammr.command.reload: true
